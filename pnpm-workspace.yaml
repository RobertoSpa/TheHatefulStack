allowBuilds:
  esbuild: true
  unrs-resolver: true
blockExoticSubdeps: true
minimumReleaseAge: 10080
overrides:
  '@graphql-tools/utils': '^12.0.2'
  deepmerge-ts: '>=8.0.2'
  qs: '>=6.16.1'
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - eslint-import-resolver-typescript
  - semver
