name: Integration

on:
  pull_request:
    paths: ['src/shared/infrastructure/**']
  schedule:
    - cron: '0 4 * * 1'

permissions: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cdn.playwright.dev:443
            github.com:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            playwright.download.prss.microsoft.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the narrow integration tests
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != 'pull_request' ]; then
            exec pnpm test:integration
          fi
          for attempt in 1 2 3; do
            if pnpm test:integration; then
              if [ "$attempt" != '1' ]; then
                echo "::warning::integration passed on attempt $attempt"
              fi
              exit 0
            fi
            echo "attempt $attempt failed"
          done
          exit 1
